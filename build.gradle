plugins {
	id 'distribution'
	id 'signing'
	alias(libs.plugins.spotless)
	alias(libs.plugins.nexus.publish)
	alias(libs.plugins.test.logger) apply false
	alias(libs.plugins.sonarqube)
	alias(libs.plugins.aggregate.javadoc)
}

apply from: 'formattedSources.gradle'

spotless {
	java {
		target(formatExtension("java"))
		targetExclude("*/src/test/**")
		importOrder()
		googleJavaFormat()
		endWithNewline()
		toggleOffOn('formatter:off', 'formatter:on')
	}
	kotlin {
		target(formatExtension("kt"))
		ktlint()
		endWithNewline()
		toggleOffOn('formatter:off', 'formatter:on')
	}
	groovyGradle {
		target("*/*.gradle")
		greclipse()
		endWithNewline()
		toggleOffOn('formatter:off', 'formatter:on')
	}
}

configurations {
	distLibs {
		canBeConsumed = false
		canBeResolved = true
	}
}

dependencies {
	javadoc project(':proguard-core')
	javadoc project(':proguard-core-android')

	distLibs project(path: ':proguard-core', configuration: 'jarDistribution')
}

javadoc {
	title          = 'ProGuardCORE'
	destinationDir = file('docs/md/api')
	options.addStringOption('Xdoclint:none', '-quiet')
}

def buildDocumentation = tasks.register("buildDocumentation", Exec) {
	dependsOn javadoc
	inputs.dir 'docs/md'
	inputs.file 'docs/mkdocs.yml'
	outputs.dir 'docs/html'
	executable 'sh'
	args '-c', "docker run --volume $rootDir/docs:/docs --rm squidfunk/mkdocs-material:9.1.19 build"
}

clean {
	delete javadoc.outputs
	//delete buildDocumentation.outputs
}

distributions {
	main {
		distributionBaseName.set('proguard-core')
		contents {
			into('lib') {
				from(configurations.distLibs)
			}
			into('docs') {
				from('docs/md') {
					includeEmptyDirs = false
					include '**/*.md'
				}
			}
			from(rootDir) {
				include 'examples/'
				exclude 'examples/build'
				exclude 'examples/.gradle'
				exclude 'examples/.idea'
				include 'LICENSE'
			}
		}
	}
}

distTar {
	compression = Compression.GZIP
	archiveExtension.set('tar.gz')
	dependsOn('javadoc')
}

distZip {
	dependsOn('javadoc')
}

nexusPublishing {
	repositories {
		sonatype {
			nexusUrl = uri("https://ossrh-staging-api.central.sonatype.com/service/local/")
			username = findProperty('PROGUARD_STAGING_USERNAME')
			password = findProperty('PROGUARD_STAGING_PASSWORD')
		}
	}
}
